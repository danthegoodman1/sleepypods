syntax = "proto3";

package sleepypods.controlplane.v1;

// OperatorControlPlane is the V1 operator-facing API surface. It is intentionally
// unary-only so the same service can be exposed over native gRPC and gRPC-Web.
// The proxy cache-miss Subscribe stream is a separate native-gRPC-only protocol
// and is not part of this browser-facing service.
service OperatorControlPlane {
  // Certificate methods require authenticated native TLS, never gRPC-Web.
  rpc PublishCertificate(PublishCertificateRequest) returns (CertificateMetadata);
  rpc GetCertificateMetadata(GetCertificateMetadataRequest) returns (CertificateMetadata);
  rpc SetTlsBinding(SetTlsBindingRequest) returns (TlsBinding);
  rpc GetTlsBinding(GetTlsBindingRequest) returns (TlsBinding);
  rpc RemoveCertificate(RemoveCertificateRequest) returns (CertificateMetadata);
  rpc ReencryptCertificate(ReencryptCertificateRequest) returns (CertificateMetadata);
  rpc CreateWorkloadClassVersion(CreateWorkloadClassVersionRequest) returns (WorkloadClassVersion);
  rpc GetWorkloadClassVersion(GetWorkloadClassVersionRequest) returns (WorkloadClassVersion);
  rpc CreateInstance(CreateInstanceRequest) returns (Instance);
  rpc GetInstance(GetInstanceRequest) returns (Instance);
  rpc DeleteInstance(DeleteInstanceRequest) returns (DeleteInstanceResponse);
  rpc CreateRouteBinding(CreateRouteBindingRequest) returns (RouteBinding);
  rpc GetRouteBinding(GetRouteBindingRequest) returns (RouteBinding);
  rpc DeleteRouteBinding(DeleteRouteBindingRequest) returns (DeleteRouteBindingResponse);
  rpc PutHttp01Challenge(PutHttp01ChallengeRequest) returns (Http01Challenge);
  rpc DeleteHttp01Challenge(DeleteHttp01ChallengeRequest) returns (DeleteHttp01ChallengeResponse);
  rpc ExpireHttp01Challenges(ExpireHttp01ChallengesRequest) returns (ExpireHttp01ChallengesResponse);
  rpc ReconcileMaterialization(ReconcileMaterializationRequest) returns (ReconcileMaterializationResponse);
  rpc ForceDeleteMaterialization(ForceDeleteMaterializationRequest) returns (ForceDeleteMaterializationResponse);
  rpc ForceReleaseExclusivityKey(ForceReleaseExclusivityKeyRequest) returns (ForceReleaseExclusivityKeyResponse);
}

// ProxyControlPlane is a native-gRPC-only proxy control-plane surface. It is
// intentionally separate from OperatorControlPlane so proxy wake and subscribe
// traffic does not expand the operator/gRPC-Web API.
service ProxyControlPlane {
  rpc ResolveHttp01Challenge(ResolveHttp01ChallengeRequest) returns (ResolveHttp01ChallengeResponse);
  rpc ResolveTlsCertificate(ResolveTlsCertificateRequest) returns (ResolveTlsCertificateResponse);
  rpc WatchTlsCertificates(stream WatchTlsCertificatesRequest) returns (stream WatchTlsCertificatesResponse);
  rpc WakeInstance(ProxyWakeInstanceRequest) returns (ProxyWakeInstanceResponse);
  rpc Subscribe(stream ProxySubscribeRequest) returns (stream ProxySubscribeResponse);
}

// SidecarControlPlane is a native-gRPC-only sidecar control-plane surface. It
// is intentionally separate from OperatorControlPlane so runtime lifecycle
// traffic does not expand the operator/gRPC-Web API.
service SidecarControlPlane {
  rpc ReportIdle(SidecarReportIdleRequest) returns (SidecarReportIdleResponse);
}

message SidecarReportIdleRequest {
  string instance_id = 1;
  uint64 expected_generation = 2;
  uint64 active_count = 3;
  // Required for automatic sleep. Legacy reports without a member identity fail closed.
  string pod_uid = 4;
}

message SidecarReportIdleResponse {
  oneof outcome {
    SidecarReportIdleAccepted accepted = 1;
    SidecarReportIdleAlreadyDraining already_draining = 2;
    SidecarReportIdleGenerationConflict generation_conflict = 3;
    SidecarReportIdleUnavailable unavailable = 4;
  }
}

message SidecarReportIdleAccepted {
  string instance_id = 1;
  uint64 instance_generation = 2;
}

message SidecarReportIdleAlreadyDraining {
  string instance_id = 1;
  uint64 instance_generation = 2;
}

message SidecarReportIdleGenerationConflict {
  string instance_id = 1;
  uint64 expected_generation = 2;
  uint64 actual_generation = 3;
}

message SidecarReportIdleUnavailable {
  string instance_id = 1;
  uint64 instance_generation = 2;
  SidecarReportIdleUnavailableReason reason = 3;
}

enum SidecarReportIdleUnavailableReason {
  SIDECAR_REPORT_IDLE_UNAVAILABLE_REASON_UNSPECIFIED = 0;
  SIDECAR_REPORT_IDLE_UNAVAILABLE_REASON_COLD = 1;
  SIDECAR_REPORT_IDLE_UNAVAILABLE_REASON_WAKING = 2;
  SIDECAR_REPORT_IDLE_UNAVAILABLE_REASON_DRAINING = 3;
  SIDECAR_REPORT_IDLE_UNAVAILABLE_REASON_FAILED = 4;
  SIDECAR_REPORT_IDLE_UNAVAILABLE_REASON_DELETING = 5;
  SIDECAR_REPORT_IDLE_UNAVAILABLE_REASON_DELETED = 6;
}

message ProxyWakeInstanceRequest {
  string instance_id = 1;
  uint64 expected_generation = 2;
  // Optional minimum freshness; the control plane allocates an actual value
  // greater than the previous materialization generation, including deleted rows.
  optional uint64 backend_generation = 3;
}

message ProxyWakeInstanceResponse {
  oneof outcome {
    ProxyWakeReadyResult ready = 1;
    ProxyWakeStillWakingResult still_waking = 2;
    ProxyWakeUnavailableResult unavailable = 3;
    ProxyWakeGenerationConflictResult generation_conflict = 4;
  }
}

message ProxyWakeReadyResult {
  string instance_id = 1;
  uint64 instance_generation = 2;
  string backend_uri = 3;
  uint64 backend_generation = 4;
  // The address the ready backend was observed at, as IP and port with IPv6
  // bracketed. Present when the materializer resolved one; clients that cannot
  // route to it directly keep using backend_uri.
  optional string backend_address = 5;
}

message ProxyWakeStillWakingResult {
  string instance_id = 1;
  uint64 instance_generation = 2;
}

message ProxyWakeUnavailableResult {
  string instance_id = 1;
  uint64 instance_generation = 2;
  ProxyWakeUnavailableReason reason = 3;
}

enum ProxyWakeUnavailableReason {
  PROXY_WAKE_UNAVAILABLE_REASON_UNSPECIFIED = 0;
  PROXY_WAKE_UNAVAILABLE_REASON_DELETING = 1;
  PROXY_WAKE_UNAVAILABLE_REASON_DELETED = 2;
}

message ProxyWakeGenerationConflictResult {
  string instance_id = 1;
  uint64 expected_generation = 2;
  uint64 actual_generation = 3;
}

message ProxySubscribeRequest {
  oneof input {
    ProxySubscribeRouteRequest subscribe_route = 1;
    ProxyUnsubscribeRequest unsubscribe = 2;
  }
}

message ProxySubscribeRouteRequest {
  string request_id = 1;
  RouteIdentity identity = 2;
}

message ProxyUnsubscribeRequest {
  string subscription_id = 1;
}

message ProxySubscribeResponse {
  oneof output {
    ProxyRouteResolvedResponse route_resolved = 1;
    ProxyRouteMissResponse route_miss = 2;
    ProxyRouteUpdatedResponse route_updated = 3;
    ProxyRouteInvalidatedResponse route_invalidated = 4;
  }
}

message ProxyRouteResolvedResponse {
  string request_id = 1;
  string subscription_id = 2;
  RouteIdentity matched_identity = 3;
  ProxyRouteEntry route = 4;
  ProxyCachePolicy cache_policy = 5;
}

message ProxyRouteMissResponse {
  string request_id = 1;
  RouteIdentity request_identity = 2;
  ProxyCachePolicy negative_cache_policy = 3;
}

message ProxyRouteUpdatedResponse {
  string subscription_id = 1;
  RouteIdentity matched_identity = 2;
  ProxyRouteEntry route = 3;
  ProxyCachePolicy cache_policy = 4;
}

message ProxyRouteInvalidatedResponse {
  string subscription_id = 1;
  ProxyRouteInvalidationReason reason = 2;
}

enum ProxyRouteInvalidationReason {
  PROXY_ROUTE_INVALIDATION_REASON_UNSPECIFIED = 0;
  PROXY_ROUTE_INVALIDATION_REASON_ROUTE_REMOVED = 1;
  PROXY_ROUTE_INVALIDATION_REASON_ROUTE_CHANGED = 2;
  PROXY_ROUTE_INVALIDATION_REASON_INSTANCE_CHANGED = 3;
  PROXY_ROUTE_INVALIDATION_REASON_BACKEND_CHANGED = 4;
  PROXY_ROUTE_INVALIDATION_REASON_STREAM_CLOSED = 5;
}

message ProxyRouteEntry {
  string route_binding_id = 1;
  string instance_id = 2;
  InstanceState instance_state = 3;
  uint64 instance_generation = 4;
  optional string backend_uri = 5;
  optional uint64 backend_generation = 6;
  // The address the ready backend was observed at, as IP and port with IPv6
  // bracketed. Present when the materializer resolved one; clients that cannot
  // route to it directly keep using backend_uri.
  optional string backend_address = 7;
}

message ProxyCachePolicy {
  uint64 ttl_millis = 1;
}

message WorkloadClassVersionRef {
  string class_id = 1;
  uint64 version = 2;
}

message WorkloadValueSchema {
  map<string, WorkloadValueFieldRule> fields = 1;
  bool allow_extra = 2;
}

message WorkloadValueFieldRule {
  bool required = 1;
  optional string default_value = 2;
}

message WorkloadSleepPolicy {
  uint64 idle_timeout_ms = 1;
  uint64 idle_retry_backoff_ms = 2;
  uint64 drain_grace_timeout_ms = 3;
  IdleTimeoutOverridePolicy idle_timeout_override = 4;
}

message WorkloadExclusivityKey {
  string name = 1;
  TemplateText value = 2;
}

message IdleTimeoutOverridePolicy {
  string value_field = 1;
  uint64 min_idle_timeout_ms = 2;
  uint64 max_idle_timeout_ms = 3;
}

message TemplateText {
  repeated TemplateTextPart parts = 1;
}

message TemplateTextPart {
  oneof kind {
    string literal = 1;
    string instance_value = 2;
  }
}

message ManifestTemplate {
  WorkloadTemplate workload = 1;
  SidecarTemplate sidecar = 2;
  ServiceTemplate service = 3;
  repeated VolumeTemplate volumes = 4;
  repeated RawKubernetesManifestTemplate raw_objects = 5;
}

message RawKubernetesManifestTemplate {
  TemplateText manifest = 1;
}

message WorkloadTemplate {
  WorkloadKind kind = 1;
  TemplateText name = 2;
  optional uint32 replicas = 3;
  ContainerTemplate app_container = 4;
}

enum WorkloadKind {
  WORKLOAD_KIND_UNSPECIFIED = 0;
  WORKLOAD_KIND_DEPLOYMENT = 1;
  WORKLOAD_KIND_STATEFUL_SET = 2;
}

message ContainerTemplate {
  string name = 1;
  TemplateText image = 2;
  repeated ContainerPortTemplate ports = 3;
  repeated EnvVarTemplate env = 4;
}

message ContainerPortTemplate {
  optional string name = 1;
  uint32 container_port = 2;
}

message EnvVarTemplate {
  string name = 1;
  TemplateText value = 2;
}

message SidecarTemplate {
  string name = 1;
  TemplateText image = 2;
  uint32 listen_port = 3;
  optional string mode = 4;
}

message ServiceTemplate {
  TemplateText name = 1;
  repeated ServicePortTemplate ports = 2;
}

message ServicePortTemplate {
  optional string name = 1;
  uint32 port = 2;
  uint32 target_port = 3;
}

message VolumeTemplate {
  string name = 1;
  TemplateText mount_path = 2;
  TemplateText pv_name = 3;
  TemplateText pvc_name = 4;
  repeated PersistentVolumeAccessMode access_modes = 5;
  TemplateText capacity = 6;
  PersistentVolumeReclaimPolicy reclaim_policy = 7;
  TemplateText storage_class_name = 8;
  PersistentVolumeSourceTemplate source = 9;
}

enum PersistentVolumeAccessMode {
  PERSISTENT_VOLUME_ACCESS_MODE_UNSPECIFIED = 0;
  PERSISTENT_VOLUME_ACCESS_MODE_READ_WRITE_ONCE = 1;
  PERSISTENT_VOLUME_ACCESS_MODE_READ_ONLY_MANY = 2;
  PERSISTENT_VOLUME_ACCESS_MODE_READ_WRITE_MANY = 3;
}

enum PersistentVolumeReclaimPolicy {
  PERSISTENT_VOLUME_RECLAIM_POLICY_UNSPECIFIED = 0;
  PERSISTENT_VOLUME_RECLAIM_POLICY_RETAIN = 1;
  PERSISTENT_VOLUME_RECLAIM_POLICY_DELETE = 2;
}

message PersistentVolumeSourceTemplate {
  oneof kind {
    CsiVolumeSourceTemplate csi = 1;
    HostPathVolumeSourceTemplate host_path = 2;
  }
}

message CsiVolumeSourceTemplate {
  TemplateText driver = 1;
  TemplateText volume_handle = 2;
  TemplateText fs_type = 3;
  bool read_only = 4;
  map<string, TemplateText> volume_attributes = 5;
  CsiSecretRefTemplate controller_publish_secret_ref = 6;
  CsiSecretRefTemplate node_stage_secret_ref = 7;
  CsiSecretRefTemplate node_publish_secret_ref = 8;
  CsiSecretRefTemplate controller_expand_secret_ref = 9;
  CsiSecretRefTemplate node_expand_secret_ref = 10;
}

message CsiSecretRefTemplate {
  TemplateText name = 1;
  TemplateText namespace = 2;
}

message HostPathVolumeSourceTemplate {
  TemplateText path = 1;
  TemplateText type = 2;
}

message WorkloadClassVersion {
  WorkloadClassVersionRef reference = 1;
  uint64 template_generation = 2;
  map<string, string> default_values = 3;
  WorkloadValueSchema value_schema = 4;
  ManifestTemplate template = 5;
  WorkloadSleepPolicy sleep_policy = 6;
  repeated WorkloadExclusivityKey exclusivity_keys = 7;
}

message CreateWorkloadClassVersionRequest {
  string idempotency_key = 1;
  string class_id = 2;
  uint64 version = 3;
  map<string, string> default_values = 4;
  WorkloadValueSchema value_schema = 5;
  uint64 template_generation = 6;
  ManifestTemplate template = 7;
  WorkloadSleepPolicy sleep_policy = 8;
  repeated WorkloadExclusivityKey exclusivity_keys = 9;
}

message GetWorkloadClassVersionRequest {
  WorkloadClassVersionRef reference = 1;
}

message Instance {
  string instance_id = 1;
  WorkloadClassVersionRef workload_class = 2;
  map<string, string> values = 3;
  InstanceState state = 4;
  uint64 generation = 5;
}

enum InstanceState {
  INSTANCE_STATE_UNSPECIFIED = 0;
  INSTANCE_STATE_COLD = 1;
  INSTANCE_STATE_WAKING = 2;
  INSTANCE_STATE_RUNNING = 3;
  INSTANCE_STATE_DRAINING = 4;
  INSTANCE_STATE_FAILED = 5;
  INSTANCE_STATE_DELETING = 6;
  INSTANCE_STATE_DELETED = 7;
}

message CreateInstanceRequest {
  string idempotency_key = 1;
  string instance_id = 2;
  WorkloadClassVersionRef workload_class = 3;
  map<string, string> values = 4;
}

message GetInstanceRequest {
  string instance_id = 1;
}

message DeleteInstanceRequest {
  string instance_id = 1;
  // Required presence, including zero. Legacy unfenced deletion calls are rejected.
  optional uint64 expected_generation = 2;
}

message DeleteInstanceResponse {
  reserved 1;
  reserved "deleted";
  // True means durable deletion accepted. GetInstance returns NotFound after cleanup.
  // New tag prevents legacy clients from interpreting acceptance as completed deletion.
  bool accepted = 2;
}

message CreateRouteBindingRequest {
  string idempotency_key = 1;
  string route_binding_id = 2;
  string instance_id = 3;
  RouteIdentity identity = 4;
  ProtocolRoute protocol = 5;
}

message GetRouteBindingRequest {
  string route_binding_id = 1;
}

message DeleteRouteBindingRequest {
  string route_binding_id = 1;
}

message DeleteRouteBindingResponse {
  bool deleted = 1;
}

message RouteBinding {
  string route_binding_id = 1;
  string instance_id = 2;
  RouteIdentity identity = 3;
  ProtocolRoute protocol = 4;
}

message RouteIdentity {
  oneof kind {
    HttpRouteIdentity http = 1;
    SniRouteIdentity sni = 2;
  }
}

message HttpRouteIdentity {
  RouteHost host = 1;
  optional string path_prefix = 2;
}

message SniRouteIdentity {
  RouteHost host = 1;
}

message RouteHost {
  RouteHostKind kind = 1;
  string host = 2;
}

enum RouteHostKind {
  ROUTE_HOST_KIND_UNSPECIFIED = 0;
  ROUTE_HOST_KIND_EXACT = 1;
  ROUTE_HOST_KIND_WILDCARD_SUFFIX = 2;
}

enum ProtocolRoute {
  PROTOCOL_ROUTE_UNSPECIFIED = 0;
  PROTOCOL_ROUTE_HTTP = 1;
  PROTOCOL_ROUTE_TLS_SNI = 2;
}

message Http01ChallengeKey {
  string host = 1;
  string token = 2;
}

message Http01Challenge {
  Http01ChallengeKey key = 1;
  string key_authorization = 2;
  int64 expires_at_unix_millis = 3;
}

message PutHttp01ChallengeRequest {
  Http01ChallengeKey key = 1;
  string key_authorization = 2;
  int64 expires_at_unix_millis = 3;
}

message ResolveHttp01ChallengeRequest {
  Http01ChallengeKey key = 1;
}

message ResolveHttp01ChallengeResponse {
  optional Http01Challenge challenge = 1;
}

message DeleteHttp01ChallengeRequest {
  Http01ChallengeKey key = 1;
}

message DeleteHttp01ChallengeResponse {
  bool deleted = 1;
}

message ExpireHttp01ChallengesRequest {
  int64 now_unix_millis = 1;
  optional uint64 limit = 2;
}

message ExpireHttp01ChallengesResponse {
  uint64 expired = 1;
}

message ReconcileMaterializationRequest {
  string materialization_id = 1;
  bool status_only = 2;
}

message ReconcileMaterializationResponse {
  bool found = 1;
  string materialization_id = 2;
  string state = 3;
  bool attempted = 4;
  string lease_owner = 5;
  int64 lease_expires_at_unix_millis = 6;
  uint64 lease_attempt = 7;
  repeated RenderedObjectRef observed_refs = 8;
  repeated ProjectionObservation projection_observations = 9;
  int64 next_attempt_at_unix_millis = 10;
  int64 operation_deadline_unix_millis = 11;
  uint32 failure_count = 12;
  string failure_kind = 13;
  string failure_message = 14;
  UncertainMaterializationEffect uncertain_effect = 15;
  string wake_failure_message = 16;
}

message UncertainMaterializationEffect {
  uint64 instance_generation = 1;
  string owner = 2;
  uint64 lease_attempt = 3;
  uint64 effect_id = 4;
  string operation = 5;
  RenderedObjectRef object = 6;
  string expected_uid = 7;
  string expected_resource_version = 8;
  int64 started_at_unix_millis = 9;
}

message ForceDeleteMaterializationRequest {
  string materialization_id = 1;
  string operator = 2;
  string reason = 3;
}

message ForceDeleteMaterializationResponse {
  bool found = 1;
  string materialization_id = 2;
  repeated RenderedObjectRef observed_refs = 3;
  repeated ProjectionObservation projection_observations = 4;
}

message RenderedObjectRef {
  string api_version = 1;
  string kind = 2;
  string namespace = 3;
  string name = 4;
}

message ProjectionObservation {
  RenderedObjectRef ref = 1;
  string state = 2;
  string reason = 3;
  repeated string finalizers = 4;
  string backend_uri = 5;
}

message ForceReleaseExclusivityKeyRequest {
  string cluster_id = 1;
  string namespace = 2;
  string key_name = 3;
  string key_value = 4;
  string operator = 5;
  string reason = 6;
}

message ForceReleaseExclusivityKeyResponse {
  uint64 updated_materializations = 1;
  repeated ProjectionObservation projection_observations = 2;
}

// Leaf-first DER chain, unencrypted PKCS#8 DER key; 128 KiB combined/16 entries.
// Only Publish and Found carry this payload. Never log these messages.
message CertificateBundle {
  repeated bytes chain_der = 1;
  bytes private_key_pkcs8_der = 2;
}
message CertificateMetadata {
  string certificate_id = 1;
  uint64 version = 2;
  bool deleted = 3;
  int64 not_before_unix_millis = 4;
  int64 not_after_unix_millis = 5;
  repeated string dns_names = 6;
  bytes leaf_sha256 = 7;
  optional string sealing_key_id = 8;
  uint64 sealing_revision = 9;
}
message PublishCertificateRequest {
  string certificate_id = 1;
  optional uint64 expected_version = 2;
  CertificateBundle bundle = 3;
}
message GetCertificateMetadataRequest { string certificate_id = 1; }
message SetTlsBindingRequest {
  string hostname = 1;
  optional uint64 expected_revision = 2;
  optional string certificate_id = 3;
}
message GetTlsBindingRequest { string hostname = 1; }
message TlsBinding {
  string hostname = 1;
  optional string certificate_id = 2;
  uint64 revision = 3;
  uint64 last_invalidating_revision = 4;
}
message RemoveCertificateRequest {
  string certificate_id = 1;
  optional uint64 expected_version = 2;
}
message ReencryptCertificateRequest {
  string certificate_id = 1;
  optional uint64 expected_version = 2;
  optional uint64 expected_sealing_revision = 3;
}
message ResolveTlsCertificateRequest {
  string server_name = 1;
  optional uint64 known_view_revision = 2;
}
message ResolveTlsCertificateResponse {
  string server_name = 1;
  uint64 view_revision = 2;
  int64 observed_at_unix_millis = 3;
  // Start this maximum authorization lifetime at the client's monotonic RPC
  // START, never receipt. Also enforce the validated chain's usable interval.
  uint64 authorization_ttl_millis = 4;
  oneof value {
    FoundTlsCertificate found = 5;
    CertificateMetadata unchanged = 6;
    MissingTlsCertificate missing = 7;
  }
}
message FoundTlsCertificate {
  CertificateMetadata metadata = 1;
  CertificateBundle bundle = 2;
}
message MissingTlsCertificate {}

// Complete bounded interest replacement; registrations correlate snapshots with
// the exact local cache incarnations captured when the request was sent.
message WatchTlsCertificatesRequest {
  uint64 registration = 1;
  repeated string hostnames = 2;
}
message WatchTlsCertificatesResponse {
  uint64 registration = 1;
  repeated TlsBinding bindings = 2;
}
